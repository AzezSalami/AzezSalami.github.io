<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Image to SVG · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/stackblur-canvas/2.5.0/stackblur.min.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/image-to-svg.js"></script>
</head>

<body>
  <main id="main" class="page">
    <header class="page-header">
      <h1>Image to SVG</h1>
      <p>Reduce an image to a few flat colours and export the result as SVG shapes.</p>
    </header>

    <section class="card">
      <label class="dropzone" id="dropZone">
        <span class="dropzone-icon" aria-hidden="true">✨</span>
        <span id="dropLabel">Tap to choose an image, or drop one here</span>
        <input type="file" accept="image/*" class="visually-hidden" />
      </label>

      <p class="alert alert--error" id="error" hidden></p>

      <div class="field-row">
        <div class="field">
          <label for="levels">Colour detail: <span id="levelsLabel"></span></label>
          <input type="range" id="levels" min="2" max="16" value="4" />
        </div>
        <div class="field">
          <label for="blur">Blur: <span id="blurLabel"></span></label>
          <input type="range" id="blur" min="0" max="20" value="1" />
        </div>
      </div>

      <div class="canvas-pair">
        <figure>
          <figcaption>Original</figcaption>
          <canvas id="originalCanvas" width="200" height="150"></canvas>
        </figure>
        <figure>
          <figcaption>Processed</figcaption>
          <canvas id="processedCanvas" width="200" height="150"></canvas>
        </figure>
      </div>

      <button class="btn btn--primary btn--block" id="convertBtn" type="button" disabled>Convert to SVG</button>

      <div id="result" class="stack" hidden>
        <div class="field">
          <label for="svgOutput">SVG output <span class="muted" id="svgSize"></span></label>
          <textarea id="svgOutput" class="code-output" readonly></textarea>
        </div>
        <div class="toolbar">
          <button class="btn" id="copyBtn" type="button">Copy SVG</button>
          <a class="btn" id="downloadLink" download="image.svg">⬇️ Download SVG</a>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
