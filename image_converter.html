<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Image Converter · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/image-converter.js"></script>
</head>

<body>
  <main id="main" class="page page--narrow">
    <header class="page-header">
      <h1>Image Converter &amp; Resizer</h1>
      <p>Resize any image (including SVG) and export it as PNG, JPEG or WebP.</p>
    </header>

    <section class="card">
      <label class="dropzone" id="dropZone">
        <span class="dropzone-icon" aria-hidden="true">📤</span>
        <span id="dropLabel">Tap to choose an image, or drop one here</span>
        <span class="dropzone-hint">Any image format your browser can open</span>
        <input type="file" accept="image/*" class="visually-hidden" />
      </label>

      <div class="field-row">
        <div class="field">
          <label for="width">Width (px)</label>
          <input type="number" id="width" value="540" min="1" max="10000" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="height">Height (px)</label>
          <input type="number" id="height" value="360" min="1" max="10000" inputmode="numeric" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="resizeMode">Resize mode</label>
          <select id="resizeMode">
            <option value="stretch">Stretch (fill, ignore aspect ratio)</option>
            <option value="contain" selected>Contain (fit inside)</option>
            <option value="cover">Cover (fill, crop overflow)</option>
          </select>
        </div>
        <div class="field">
          <label for="format">Format</label>
          <select id="format">
            <option value="image/png">PNG</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>
      </div>

      <button class="btn btn--primary btn--block" id="convertBtn" type="button" disabled>Convert</button>
      <p class="alert alert--error" id="error" hidden></p>

      <div id="result" class="stack" hidden>
        <img id="previewImg" class="preview-img" alt="Converted image" />
        <p class="muted" id="info" style="text-align: center"></p>
        <a class="btn btn--block" id="downloadLink">⬇️ Download</a>
      </div>
    </section>
  </main>
</body>

</html>
