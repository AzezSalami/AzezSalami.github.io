<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Image to Base64 · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/image-to-base64.js"></script>
</head>

<body>
  <main id="main" class="page page--narrow">
    <header class="page-header">
      <h1>Image to Base64</h1>
      <p>Turn an image into a data URL you can paste into HTML or CSS.</p>
    </header>

    <section class="card">
      <label class="dropzone" id="dropZone">
        <span class="dropzone-icon" aria-hidden="true">🖼️</span>
        <span id="dropLabel">Tap to choose an image, or drop one here</span>
        <input type="file" accept="image/*" class="visually-hidden" />
      </label>

      <p class="alert alert--error" id="error" hidden></p>

      <div id="result" class="stack" hidden>
        <img id="preview" class="preview-img" alt="Preview of the selected image" />
        <div class="field">
          <label for="output">Base64 output <span class="muted" id="outputSize"></span></label>
          <textarea id="output" class="code-output" readonly></textarea>
        </div>
        <button class="btn btn--primary" id="copyBtn" type="button">Copy to clipboard</button>
      </div>
    </section>
  </main>
</body>

</html>
