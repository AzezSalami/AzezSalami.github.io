<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Image to PDF · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/image-to-pdf.js"></script>
</head>

<body>
  <main id="main" class="page page--narrow">
    <header class="page-header">
      <h1>Image to PDF</h1>
      <p>Combine one or more images into a single PDF, one image per page.</p>
    </header>

    <section class="card">
      <label class="dropzone" id="dropZone">
        <span class="dropzone-icon" aria-hidden="true">📄</span>
        <span id="dropLabel">Tap to choose images, or drop them here</span>
        <input type="file" accept="image/*" multiple class="visually-hidden" />
      </label>

      <p class="alert alert--error" id="error" hidden></p>

      <div class="thumbs" id="previews"></div>

      <button class="btn btn--primary btn--block" id="convertBtn" type="button" hidden>Convert to PDF</button>
      <a class="btn btn--block" id="downloadLink" download="images.pdf" hidden>⬇️ Download PDF</a>
    </section>
  </main>
</body>

</html>
