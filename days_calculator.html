<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Days Calculator · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/days-calculator.js"></script>
</head>

<body>
  <main id="main" class="page page--narrow">
    <header class="page-header">
      <h1>Days Between Dates</h1>
      <p>Pick two dates; the result updates instantly.</p>
    </header>

    <section class="card">
      <div class="date-fields">
        <div class="field">
          <label for="startDate">Start date</label>
          <input type="date" id="startDate" />
        </div>
        <button class="icon-btn swap-btn" id="swapBtn" type="button" aria-label="Swap dates" title="Swap dates">⇅</button>
        <div class="field">
          <label for="endDate">End date</label>
          <input type="date" id="endDate" />
        </div>
      </div>

      <div id="result" aria-live="polite">
        <div class="stats stats--3">
          <div class="stat"><span class="stat-value" id="years">0</span><span class="stat-label">Years</span></div>
          <div class="stat"><span class="stat-value" id="months">0</span><span class="stat-label">Months</span></div>
          <div class="stat"><span class="stat-value" id="days">0</span><span class="stat-label">Days</span></div>
        </div>
        <p class="total-days" id="totalDays" style="margin-top: 1rem"></p>
        <p class="muted" id="resultDetails" style="text-align: center"></p>
      </div>
    </section>
  </main>
</body>

</html>
