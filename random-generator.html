<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Random Generator · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/random-generator.js"></script>
</head>

<body>
  <main id="main" class="page page--narrow">
    <header class="page-header">
      <h1>Random Generator</h1>
      <p>Random strings and integers from your browser's cryptographic generator.</p>
    </header>

    <section class="card">
      <div class="tabs" role="tablist" aria-label="Generator type">
        <button class="tab" type="button" role="tab" id="tab-string" aria-controls="panel-string" aria-selected="true">String</button>
        <button class="tab" type="button" role="tab" id="tab-integer" aria-controls="panel-integer" aria-selected="false">Integer</button>
      </div>

      <div id="panel-string" role="tabpanel" aria-labelledby="tab-string">
        <div class="field">
          <label for="stringLength">Length</label>
          <input type="number" id="stringLength" min="1" max="1000" value="8" inputmode="numeric" />
        </div>

        <fieldset class="field" style="border: 0; padding: 0; margin-inline: 0">
          <legend class="label" style="padding: 0; font-size: 0.875rem; font-weight: 600">Character types</legend>
          <div class="checks">
            <label class="check"><input type="checkbox" id="uppercase" /> Uppercase (A–Z)</label>
            <label class="check"><input type="checkbox" id="lowercase" checked /> Lowercase (a–z)</label>
            <label class="check"><input type="checkbox" id="numbers" checked /> Numbers (0–9)</label>
            <label class="check"><input type="checkbox" id="symbols" /> Symbols (!@#$%^&amp;*)</label>
          </div>
        </fieldset>

        <button class="btn btn--primary btn--block" id="generateStringBtn" type="button">Generate string</button>
        <p class="alert alert--error" id="stringError" hidden></p>
        <div class="output">
          <output class="output-value" id="stringResult"></output>
          <button class="btn btn--small" type="button" data-copy="stringResult">Copy</button>
        </div>
      </div>

      <div id="panel-integer" role="tabpanel" aria-labelledby="tab-integer" hidden>
        <div class="field">
          <label for="intType">Mode</label>
          <select id="intType">
            <option value="single">Single number by digit count</option>
            <option value="range">Number in range</option>
            <option value="multiple">Multiple numbers</option>
          </select>
        </div>

        <div data-mode="single" class="field">
          <label for="intDigits">Number of digits</label>
          <input type="number" id="intDigits" min="1" max="15" value="5" inputmode="numeric" />
        </div>

        <div data-mode="range" class="field-row" hidden>
          <div class="field">
            <label for="minValue">Minimum</label>
            <input type="number" id="minValue" value="1" inputmode="numeric" />
          </div>
          <div class="field">
            <label for="maxValue">Maximum</label>
            <input type="number" id="maxValue" value="100" inputmode="numeric" />
          </div>
        </div>

        <div data-mode="multiple" class="field-row" hidden>
          <div class="field">
            <label for="count">Count</label>
            <input type="number" id="count" min="1" max="100" value="5" inputmode="numeric" />
          </div>
          <div class="field">
            <label for="multDigits">Digits each</label>
            <input type="number" id="multDigits" min="1" max="10" value="3" inputmode="numeric" />
          </div>
        </div>

        <button class="btn btn--primary btn--block" id="generateIntBtn" type="button">Generate integer(s)</button>
        <p class="alert alert--error" id="intError" hidden></p>
        <div class="output">
          <output class="output-value" id="intResult"></output>
          <button class="btn btn--small" type="button" data-copy="intResult">Copy</button>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
