<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Snake · Tools</title>
  <meta name="description" content="Snake and a collection of handy browser tools." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/snake.js"></script>
</head>

<body>
  <main id="main" class="page page--narrow">
    <header class="page-header">
      <h1>Snake</h1>
      <p>Arrow keys or WASD on a keyboard; swipe or use the D-pad on a phone.</p>
    </header>

    <section class="card">
      <div class="snake-score">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
      </div>

      <div class="snake-board" id="board">
        <canvas id="gameCanvas" aria-label="Snake game board"></canvas>
        <div class="snake-overlay" id="overlay" aria-live="polite">
          <strong id="overlayTitle">Ready?</strong>
          <span id="overlayText">Press Start to play</span>
        </div>
      </div>

      <div class="toolbar" style="justify-content: center">
        <button class="btn btn--primary" id="startBtn" type="button">Start</button>
        <button class="btn" id="resetBtn" type="button">Reset</button>
      </div>

      <div class="dpad" id="dpad">
        <button class="btn" type="button" data-dir="up" aria-label="Up">▲</button>
        <button class="btn" type="button" data-dir="left" aria-label="Left">◀</button>
        <button class="btn" type="button" data-dir="down" aria-label="Down">▼</button>
        <button class="btn" type="button" data-dir="right" aria-label="Right">▶</button>
      </div>
    </section>
  </main>
</body>

</html>
