<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Character Counter · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/lib/text-stats.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/character-counter.js"></script>
</head>

<body>
  <main id="main" class="page page--narrow">
    <header class="page-header">
      <h1>Character Counter</h1>
      <p>Detailed statistics for any text, updated as you type.</p>
    </header>

    <section class="card">
      <textarea id="textInput" placeholder="Start typing or paste your text here…" aria-label="Text to analyse"></textarea>

      <div class="stats">
        <div class="stat"><span class="stat-value" id="charCount">0</span><span class="stat-label">Characters</span></div>
        <div class="stat"><span class="stat-value" id="charNoSpaces">0</span><span class="stat-label">No spaces</span></div>
        <div class="stat"><span class="stat-value" id="wordCount">0</span><span class="stat-label">Words</span></div>
        <div class="stat"><span class="stat-value" id="lineCount">1</span><span class="stat-label">Lines</span></div>
      </div>

      <dl class="stat-list">
        <div><dt>Paragraphs</dt><dd id="paragraphCount">0</dd></div>
        <div><dt>Sentences</dt><dd id="sentenceCount">0</dd></div>
        <div><dt>Average word length</dt><dd id="avgWordLength">0</dd></div>
        <div><dt>Reading time (avg)</dt><dd id="readingTime">0 min</dd></div>
      </dl>

      <button class="btn btn--block" id="clearBtn" type="button">Clear text</button>
    </section>
  </main>
</body>

</html>
