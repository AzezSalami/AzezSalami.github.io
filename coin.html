<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Coin Flip · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/coin.js"></script>
</head>

<body>
  <main id="main" class="page page--narrow">
    <header class="page-header">
      <h1>Coin Flip</h1>
      <p>Tap the coin or the button to flip.</p>
    </header>

    <section class="card">
      <div class="coin-toss" id="coinToss">
        <button class="coin" id="coin" type="button" aria-label="Flip the coin">
          <span class="coin-face coin-face--heads"></span>
          <span class="coin-face coin-face--tails"></span>
        </button>
      </div>

      <p class="coin-result" id="result" aria-live="polite"></p>

      <button class="btn btn--primary btn--block" id="flipBtn" type="button">Flip coin</button>

      <div class="stats">
        <div class="stat"><span class="stat-value" id="headsCount">0</span><span class="stat-label">Heads</span></div>
        <div class="stat"><span class="stat-value" id="tailsCount">0</span><span class="stat-label">Tails</span></div>
      </div>
    </section>
  </main>
</body>

</html>
