<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Case Converter · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/case-converter.js"></script>
</head>

<body>
  <main id="main" class="page page--narrow">
    <header class="page-header">
      <h1>Case Converter</h1>
      <p>Type an identifier or phrase and get every naming convention at once.</p>
    </header>

    <section class="card">
      <div class="field">
        <label for="inputText">Text to convert</label>
        <input type="text" id="inputText" placeholder="e.g. my variable name" autocomplete="off" autocapitalize="off"
          spellcheck="false" />
      </div>

      <p class="alert">Detected case: <strong id="detectedCase">None</strong></p>

      <div class="case-list" id="caseList"></div>
    </section>
  </main>
</body>

</html>
