<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JWT Encoder &amp; Decoder · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/jwt.js"></script>
</head>

<body>
  <main id="main" class="page">
    <header class="page-header">
      <h1>JWT Encoder &amp; Decoder</h1>
      <p>Sign and inspect JSON Web Tokens. Secrets and tokens never leave your browser.</p>
    </header>

    <section class="card">
      <div class="tabs" role="tablist" aria-label="Mode">
        <button class="tab" type="button" role="tab" id="tab-encode" aria-controls="panel-encode" aria-selected="true">Encode</button>
        <button class="tab" type="button" role="tab" id="tab-decode" aria-controls="panel-decode" aria-selected="false">Decode</button>
      </div>

      <div id="panel-encode" role="tabpanel" aria-labelledby="tab-encode">
        <div class="split">
          <form id="encodeForm" class="stack">
            <div class="field">
              <label for="algorithm">Algorithm</label>
              <select id="algorithm">
                <option value="HS256">HS256 (HMAC SHA-256)</option>
                <option value="HS384">HS384 (HMAC SHA-384)</option>
                <option value="HS512">HS512 (HMAC SHA-512)</option>
              </select>
            </div>
            <div class="field">
              <label for="header">Header (JSON)</label>
              <textarea id="header" class="mono" style="min-height: 6rem" spellcheck="false"></textarea>
            </div>
            <div class="field">
              <label for="payload">Payload (JSON)</label>
              <textarea id="payload" class="mono" spellcheck="false"></textarea>
            </div>
            <div class="field">
              <label for="secret">Secret key</label>
              <input type="text" id="secret" class="mono" value="your-256-bit-secret" autocomplete="off"
                autocapitalize="off" spellcheck="false" />
            </div>
            <button class="btn btn--primary btn--block" type="submit">Generate JWT</button>
          </form>

          <div>
            <p class="alert alert--error" id="encodeError" hidden></p>
            <div id="encodeResult" hidden>
              <div class="field">
                <label for="jwtOutput">Generated JWT</label>
                <textarea id="jwtOutput" class="jwt-token" readonly></textarea>
              </div>
              <button class="btn btn--small" id="copyJwtBtn" type="button" style="margin-block: 0.5rem 1rem">Copy token</button>
              <div class="jwt-parts" id="encodeParts"></div>
            </div>
            <p class="muted" id="encodeHint">Your signed token will appear here.</p>
          </div>
        </div>
      </div>

      <div id="panel-decode" role="tabpanel" aria-labelledby="tab-decode" hidden>
        <form id="decodeForm" class="stack">
          <div class="field">
            <label for="jwtInput">JWT token</label>
            <textarea id="jwtInput" class="jwt-token" placeholder="Paste your JWT token here…" spellcheck="false"
              autocapitalize="off"></textarea>
          </div>
          <button class="btn btn--primary" type="submit">Decode JWT</button>
        </form>
        <p class="alert alert--error" id="decodeError" hidden></p>
        <p class="alert alert--warning" id="expiredWarning" hidden>⚠️ This token has expired.</p>
        <div class="jwt-parts" id="decodeParts"></div>
        <p class="muted" id="decodeNote" hidden>The signature is shown as-is; verifying it requires the secret key.</p>
      </div>
    </section>
  </main>
</body>

</html>
