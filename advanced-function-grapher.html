<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Function Grapher · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/function-grapher.js"></script>
</head>

<body>
  <main id="main" class="page">
    <header class="page-header">
      <h1>Function Grapher</h1>
      <p>Plot a function of <code>x</code>. Use <code>±</code> to draw both branches at once.</p>
    </header>

    <section class="card">
      <form id="graphForm">
        <label class="visually-hidden" for="functionInput">Function of x</label>
        <div class="graph-input">
          <input type="text" id="functionInput" class="mono" value="x^2 ± 1" placeholder="e.g. sin(x) ± 0.5"
            autocomplete="off" autocapitalize="off" spellcheck="false" />
          <button class="btn" id="plusMinusBtn" type="button" aria-label="Insert plus-minus sign">±</button>
          <button class="btn btn--primary" type="submit">Graph</button>
        </div>
      </form>

      <p class="muted">Examples: <code>x^2 ± 1</code>, <code>±x</code>, <code>sin(x) ± 0.5</code>, <code>±sqrt(9 - x^2)</code></p>

      <details class="symbols">
        <summary>Symbols you can use</summary>
        <p class="muted">Tap a symbol to insert it. Angles are in radians, and you can skip the <code>*</code>:
          <code>2x</code> and <code>3sin(x)</code> work.</p>
        <div id="symbolGroups"></div>
      </details>

      <p class="alert alert--error" id="errorMessage" hidden></p>

      <canvas id="graphCanvas" class="graph-canvas" aria-label="Graph of the function"></canvas>

      <div class="toolbar">
        <button class="btn btn--small" id="zoomOutBtn" type="button" aria-label="Zoom out">−</button>
        <button class="btn btn--small" id="zoomInBtn" type="button" aria-label="Zoom in">+</button>
        <button class="btn btn--small" id="zoomResetBtn" type="button">Reset zoom</button>
        <div class="legend" id="legend"></div>
      </div>
    </section>
  </main>
</body>

</html>
