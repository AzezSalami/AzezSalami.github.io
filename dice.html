<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dice Roller · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/dice.js"></script>
</head>

<body>
  <main id="main" class="page">
    <header class="page-header">
      <h1>Dice Roller</h1>
      <p>Tap a single die to re-roll it, or roll them all at once.</p>
    </header>

    <section class="card">
      <div class="toolbar">
        <select id="diceCount" aria-label="Number of dice" style="width: auto">
          <option value="1">1 die</option>
          <option value="2" selected>2 dice</option>
          <option value="3">3 dice</option>
          <option value="4">4 dice</option>
          <option value="5">5 dice</option>
          <option value="6">6 dice</option>
          <option value="8">8 dice</option>
          <option value="10">10 dice</option>
        </select>
        <button class="btn btn--primary" id="rollButton" type="button">Roll dice</button>
      </div>

      <div class="dice-table" id="diceContainer"></div>

      <p class="dice-total" aria-live="polite">Total: <span id="total">0</span></p>
    </section>
  </main>
</body>

</html>
