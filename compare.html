<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Text Compare · Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script defer src="js/lib/ui.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/tools/compare.js"></script>
</head>

<body>
  <main id="main" class="page">
    <header class="page-header">
      <h1>Text Compare</h1>
      <p>See which words were added or removed between two versions of a text.</p>
    </header>

    <section class="card">
      <div class="split">
        <div class="field">
          <label for="text1">Original text</label>
          <textarea id="text1"></textarea>
        </div>
        <div class="field">
          <label for="text2">Modified text</label>
          <textarea id="text2"></textarea>
        </div>
      </div>

      <button class="btn btn--primary" id="compareBtn" type="button">Compare texts</button>
    </section>

    <section class="card" id="resultCard" hidden>
      <div class="stats stats--3">
        <div class="stat"><span class="stat-value" id="diffCount">0</span><span class="stat-label">Differences</span></div>
        <div class="stat"><span class="stat-value" id="addCount">0</span><span class="stat-label">Additions</span></div>
        <div class="stat"><span class="stat-value" id="delCount">0</span><span class="stat-label">Deletions</span></div>
      </div>
      <div class="diff" id="result"></div>
    </section>
  </main>
</body>

</html>
